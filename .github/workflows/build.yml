name: Construire PlatForge Studio
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            out: PlatForge-Windows.exe
          - os: macos-latest
            out: PlatForge-macOS.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pf_editor
      - name: Préparer le fichier
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/platforge.exe "${{ matrix.out }}"
          else
            mkdir PlatForge && cp target/release/platforge PlatForge/ && chmod +x PlatForge/platforge
            tar czf "${{ matrix.out }}" PlatForge
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}

  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Outils
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl git build-essential pkg-config libasound2-dev libxkbcommon-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pf_editor
      - name: Préparer le fichier
        run: |
          mkdir PlatForge && cp target/release/platforge PlatForge/ && chmod +x PlatForge/platforge
          tar czf PlatForge-Linux.tar.gz PlatForge
      - uses: actions/upload-artifact@v4
        with:
          name: PlatForge-Linux.tar.gz
          path: PlatForge-Linux.tar.gz
      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PlatForge-Linux.tar.gz
